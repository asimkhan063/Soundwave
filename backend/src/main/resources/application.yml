spring:
  application:
    name: music-player-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:music_player}
    username: ${DB_USERNAME:music_user}
    password: ${DB_PASSWORD:music_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

app:
  jwt:
    # Local development key only. Set JWT_SECRET to a private random value in deployment.
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy-1234567890}
    expiration-minutes: 120

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:5173}

media:
  storage-provider: ${AUDIO_STORAGE_PROVIDER:local}
  storage-dir: ${AUDIO_STORAGE_DIR:./uploads}
  s3:
    endpoint: ${AWS_ENDPOINT_URL_S3:}
    bucket: ${S3_BUCKET:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:us-east-2}

jamendo:
  client-id: ${JAMENDO_CLIENT_ID:}


server:
  port: ${PORT:8181}

management:
  endpoints:
    web:
      exposure:
        include: health

