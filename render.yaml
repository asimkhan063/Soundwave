services:
  - type: web
    name: soundwave-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    disk:
      name: soundwave-audio
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: soundwave-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: soundwave-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: soundwave-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: soundwave-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: soundwave-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUDIO_STORAGE_DIR
        value: /var/data/uploads

databases:
  - name: soundwave-db
    databaseName: music_player
    user: music_user
    plan: free
    region: singapore
    postgresMajorVersion: "17"
